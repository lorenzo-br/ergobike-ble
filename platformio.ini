; PlatformIO Project Configuration File for ErgoBike BLE Adapter
; ESP32-C3 with 18650 Battery & Stationary Bike P1/P2 Sensor

[platformio]
default_envs = esp32-c3
src_dir = src
include_dir = include

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -std=gnu++17

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^6.21.3
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    mathieucarbou/AsyncTCP @ ^3.2.4

[env:esp32-c3-ftms-only]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -D ERGOBIKE_FTMS_ONLY=1

[env:native]
platform = native
test_framework = custom
build_flags = 
    -std=c++17
    -D NATIVE_TEST
